services:
  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8080
    environment:
      API_PROXY_TARGET: http://backend:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Db__DefaultConnection: "Host=database;Port=5432;Database=${LOCAL_POSTGRES_DB:-cube_timer};Username=${LOCAL_POSTGRES_USER:-cube_timer};Password=${LOCAL_POSTGRES_PASSWORD:-cube_timer_dev}"
    ports:
      - "${BACKEND_PORT:-5164}:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-cube_timer}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-cube_timer}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-cube_timer_dev}
    ports:
      - "${LOCAL_POSTGRES_PORT:-54329}:5432"
    volumes:
      - cube_timer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: "postgres://${LOCAL_POSTGRES_USER:-cube_timer}:${LOCAL_POSTGRES_PASSWORD:-cube_timer_dev}@database:5432/${LOCAL_POSTGRES_DB:-cube_timer}?sslmode=disable"
    ports:
      - "${LOCAL_PGWEB_PORT:-8081}:8081"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cube_timer_postgres:
