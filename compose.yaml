services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-cube_timer}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-cube_timer}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-cube_timer_dev}
    ports:
      - "${LOCAL_POSTGRES_PORT:-54329}:5432"
    volumes:
      - cube_timer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cube_timer_postgres:
